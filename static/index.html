<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocalis - Pitch Visualizer</title>
  <script
    src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/html-midi-player@0.4.0/+esm"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #121212;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.8rem;
    }

    p {
      margin: 0;
      color: #a0a0a0;
    }

    .dropzone {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 2.5rem;
      text-align: center;
      background: #1e1e1e;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .dropzone.dragover {
      border-color: #646cff;
      background: #252535;
    }

    .status {
      min-height: 24px;
      font-size: 0.95rem;
      color: #8ab4f8;
    }

    .viewer-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    midi-player {
      width: 100%;
    }

    midi-visualizer .piano-roll-visualizer {
      background: #181818;
      border-radius: 6px;
      border: 1px solid #333;
      height: 350px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <h1>Vocalis</h1>
      <p>音声（WAV, MP3等）または MIDI（.mid）をアップロードして音程を可視化します。</p>
    </div>

    <div class="dropzone" id="dropzone">
      <span>ここにファイルをドラッグ＆ドロップ、またはクリックして選択</span>
      <input type="file" id="fileInput" accept=".wav,.mp3,.ogg,.flac,.m4a,.mid,.midi" style="display: none;">
    </div>

    <div class="status" id="statusText"></div>

    <div class="viewer-card" id="viewerCard">
      <div id="fileInfo" style="font-weight: bold; color: #eee;"></div>
      <midi-player id="player" sound-font visualizer="#visualizer"></midi-player>
      <midi-visualizer type="piano-roll" id="visualizer"></midi-visualizer>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('statusText');
    const viewerCard = document.getElementById('viewerCard');
    const fileInfo = document.getElementById('fileInfo');
    const player = document.getElementById('player');
    const visualizer = document.getElementById('visualizer');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      const isMidi = file.name.endsWith('.mid') || file.name.endsWith('.midi');
      statusText.textContent = isMidi ? 'MIDI を取り込み中...' : '音声を解析して MIDI を抽出中（少々お待ちください）...';
      viewerCard.style.display = 'none';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'アップロードに失敗しました');
        }

        const data = await res.json();
        statusText.textContent = '読み込み完了！';
        fileInfo.textContent = `表示中: ${data.filename}`;

        // midi-player と midi-visualizer の src を更新
        player.src = data.midi_url;
        visualizer.src = data.midi_url;
        viewerCard.style.display = 'flex';
      } catch (err) {
        statusText.textContent = `エラー: ${err.message}`;
      }
    }
  </script>
</body>

</html>
